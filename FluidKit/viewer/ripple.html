<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FluidKit — 波紋とコースティクス</title>
  <style>
    :root { --bg: #0a0a12; --panel: rgba(12,12,24,0.9); --line: rgba(80,140,255,0.25); --text: #e0e0e0; --muted: #8da2c2; --on: rgba(60,160,255,0.45); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; font-size: 13px; min-height: 100vh; }
    .num { font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace; font-variant-numeric: tabular-nums; }
    svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    button, a.chip { font: inherit; color: #a8c8ff; background: rgba(60,90,160,0.35); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    button:hover, a.chip:hover { background: rgba(80,120,220,0.55); }
    button:focus-visible, a.chip:focus-visible, input:focus-visible, .tip:focus-visible, canvas:focus-visible { outline: 2px solid #9cc7ff; outline-offset: 2px; }
    button[aria-pressed="true"] { background: var(--on); color: #fff; border-color: #60a0ff; }

    #topbar { position: sticky; top: 0; z-index: 10; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #topbar .brand { font-size: 14px; font-weight: 600; color: #7ab4ff; margin-right: 6px; white-space: nowrap; }
    #topbar .spacer { flex: 1; }

    main { display: grid; grid-template-columns: 260px 1fr; gap: 14px; padding: 14px 16px 60px; align-items: start; }
    #panel { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    #panel h2 { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 8px; }
    .section { margin-bottom: 16px; } .section:last-child { margin-bottom: 0; }
    .field { position: relative; margin-bottom: 9px; }
    .field > .head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #b8c6dd; margin-bottom: 4px; }
    .field > .head .val { color: #9ab8e0; min-width: 64px; text-align: right; }
    .tip { display: inline-flex; vertical-align: middle; margin-left: 4px; color: var(--muted); cursor: help; }
    .tip svg.i { width: 13px; height: 13px; }
    .tip::after { content: attr(data-tip); display: none; position: absolute; left: 0; right: 0; top: 24px; z-index: 30; padding: 7px 9px; font-size: 11px; line-height: 1.5; color: var(--text); background: #14182c; border: 1px solid var(--line); border-radius: 6px; }
    .tip:hover::after, .tip:focus::after { display: block; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: rgba(80,140,255,0.25); border-radius: 2px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #5090ff; border-radius: 50%; cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; background: #5090ff; border: 0; border-radius: 50%; cursor: pointer; }
    input[type=range]:focus-visible { outline: 2px solid #9cc7ff; outline-offset: 4px; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.6; }
    dl.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; }
    dl.stats dt { color: var(--muted); } dl.stats dd { color: #9ab8e0; text-align: right; }

    #views { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
    figure { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    figcaption { font-size: 12px; color: #b8c6dd; margin-bottom: 8px; }
    figcaption small { color: var(--muted); margin-left: 6px; }
    canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 6px; touch-action: none; cursor: crosshair; image-rendering: auto; }
    .legend { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .legend canvas { width: 120px; height: 8px; aspect-ratio: auto; cursor: default; border-radius: 2px; }

    #note { position: fixed; left: 16px; right: 16px; bottom: 8px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; background: var(--bg); padding: 4px 0; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></symbol>
  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 16a4 4 0 0 1 .5-8 5 5 0 0 1 9.6 1.5A3.3 3.3 0 0 1 17 16M9 19v2M13 19v2M17 19v2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
</svg>

<header id="topbar">
  <a class="chip" href="index.html"><svg class="i"><use href="#i-back"/></svg>ビューアに戻る</a>
  <span class="brand">波紋とコースティクス</span>
  <span class="spacer"></span>
  <button id="btn-rain" aria-pressed="false"><svg class="i"><use href="#i-rain"/></svg>雨</button>
  <button id="btn-reset"><svg class="i"><use href="#i-reset"/></svg>リセット</button>
  <button id="btn-play" aria-label="一時停止"><svg class="i" id="ic-play"><use href="#i-pause"/></svg><span id="lbl-play">一時停止</span></button>
</header>

<main>
  <aside id="panel">
    <div class="section">
      <h2>水面</h2>
      <div class="field">
        <div class="head"><label for="sl-speed">波速 c<span class="tip" tabindex="0" data-tip="波が進む速さ[m/s]。大きいほど速く広がる。大きくすると安定な時間刻みが小さくなり、自動で分割される。"><svg class="i"><use href="#i-info"/></svg></span></label><span class="val num" id="lbl-speed">1.20</span></div>
        <input type="range" id="sl-speed" min="0.2" max="3" step="0.05" value="1.2" />
      </div>
      <div class="field">
        <div class="head"><label for="sl-damp">減衰 γ<span class="tip" tabindex="0" data-tip="波が弱まる速さ[1/s]。0 に近いと長く残る。縁には別に吸収層があり、反射を抑えている。"><svg class="i"><use href="#i-info"/></svg></span></label><span class="val num" id="lbl-damp">0.30</span></div>
        <input type="range" id="sl-damp" min="0" max="3" step="0.05" value="0.3" />
      </div>
      <div class="field">
        <div class="head"><label for="sl-dt">1 フレームの時間刻み<span class="tip" tabindex="0" data-tip="1 フレームで進めるシミュレーション時間[ms]。安定限界を超えると自動で細かく分割するため、大きくしても発散しない(下の統計で確認できる)。"><svg class="i"><use href="#i-info"/></svg></span></label><span class="val num" id="lbl-dt">16.7 ms</span></div>
        <input type="range" id="sl-dt" min="4" max="250" step="1" value="17" />
      </div>
    </div>
    <div class="section">
      <h2>床のコースティクス</h2>
      <div class="field">
        <div class="head"><label for="sl-depth">水深 D<span class="tip" tabindex="0" data-tip="水面から床までの深さ[m]。深いほど光が大きく曲がって集まる(小さい傾きの近似)。"><svg class="i"><use href="#i-info"/></svg></span></label><span class="val num" id="lbl-depth">1.00</span></div>
        <input type="range" id="sl-depth" min="0.1" max="3" step="0.05" value="1.0" />
      </div>
      <div class="field">
        <div class="head"><label for="sl-gain">明るさ<span class="tip" tabindex="0" data-tip="表示の明るさだけを変える。計算結果(強度)は変わらない。"><svg class="i"><use href="#i-info"/></svg></span></label><span class="val num" id="lbl-gain">0.40</span></div>
        <input type="range" id="sl-gain" min="0.1" max="1" step="0.05" value="0.4" />
      </div>
    </div>
    <div class="section">
      <h2>統計(毎フレーム)</h2>
      <dl class="stats num">
        <dt>安定限界 dt</dt><dd id="st-stable">-</dd>
        <dt>実効 dt</dt><dd id="st-dt">-</dd>
        <dt>サブステップ数</dt><dd id="st-sub">-</dd>
        <dt>CFL 数 (≤ 0.71)</dt><dd id="st-cfl">-</dd>
        <dt>最大 |h|</dt><dd id="st-max">-</dd>
        <dt>エネルギー</dt><dd id="st-energy">-</dd>
        <dt>床の強度 平均</dt><dd id="st-cmean">-</dd>
        <dt>床の強度 最大</dt><dd id="st-cmax">-</dd>
      </dl>
    </div>
    <p class="hint">水面(左)をクリック・ドラッグすると波を立てられます。床(右)は水面の傾きから屈折した光が集まる様子で、強度 1 が一様な明るさです。</p>
  </aside>

  <section id="views">
    <figure>
      <figcaption>水面(高さ場)<small>明るい側が光源方向に傾いた面</small></figcaption>
      <canvas id="cv-surface" width="128" height="128" tabindex="0" aria-label="水面。クリックまたはドラッグで波を立てる"></canvas>
    </figure>
    <figure>
      <figcaption>床のコースティクス<small>屈折した光の集まり(2D・床の 1 枚)</small></figcaption>
      <canvas id="cv-floor" width="64" height="64" aria-label="床のコースティクス"></canvas>
      <div class="legend num"><span>強度 0</span><canvas id="lg-floor" width="120" height="8"></canvas><span id="lg-floor-max">-</span></div>
    </figure>
  </section>
</main>

<div id="note"><svg class="i"><use href="#i-info"/></svg>近似であり、物理的に厳密ではありません(線形の波動方程式 + 小さい傾きの屈折近似。学習用の簡易実装です)</div>

<script src="js/heightfield.js"></script>
<script>
(function () {
  const { HeightField } = FluidKitHeightField;
  const $ = id => document.getElementById(id);
  const N = 128, SIZE = 2.0;
  const hf = new HeightField({ n: N, size: SIZE, speed: 1.2, damping: 0.3 });
  const state = { playing: !matchMedia('(prefers-reduced-motion: reduce)').matches, rain: false, depth: 1.0, gain: 0.4, dtFrame: 1 / 60, rainClock: 0 };

  // 初期の波紋
  function seed() { hf.reset(); hf.disturb(SIZE * 0.4, SIZE * 0.45, 0.12, 0.1); }
  seed();

  const surf = $('cv-surface'), sctx = surf.getContext('2d'), simg = sctx.createImageData(N, N);
  const flr = $('cv-floor'), fctx = flr.getContext('2d');
  let fimg = null;

  // 床の色: 暗い青緑 + 強度 × 明るさ
  const FLOOR_BASE = [6, 30, 48], FLOOR_LIGHT = [130, 225, 240];
  function floorColor(I, gain) {
    const t = Math.min(1, I * gain);
    return FLOOR_BASE.map((b, k) => b + (FLOOR_LIGHT[k] - b) * t);
  }

  function drawSurface() {
    const d = simg.data, L = [0.55, -0.45];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const [gx, gy] = hf.gradient(i, j);
      const v = Math.max(0, Math.min(1, 0.5 + 9 * (gx * L[0] + gy * L[1])));
      const o = (j * N + i) * 4;
      d[o] = 10 + 120 * v; d[o + 1] = 40 + 165 * v; d[o + 2] = 80 + 155 * v; d[o + 3] = 255;
    }
    sctx.putImageData(simg, 0, 0);
  }

  function drawFloor(c) {
    if (!fimg || fimg.width !== c.res) fimg = fctx.createImageData(c.res, c.res);
    if (flr.width !== c.res) { flr.width = c.res; flr.height = c.res; fimg = fctx.createImageData(c.res, c.res); }
    for (let k = 0; k < c.floor.length; k++) {
      const col = floorColor(c.floor[k], state.gain), o = k * 4;
      fimg.data[o] = col[0]; fimg.data[o + 1] = col[1]; fimg.data[o + 2] = col[2]; fimg.data[o + 3] = 255;
    }
    fctx.putImageData(fimg, 0, 0);
  }

  function drawLegend() {
    const c = $('lg-floor'), g = c.getContext('2d');
    for (let x = 0; x < c.width; x++) {
      const col = floorColor((x / (c.width - 1)) * (1 / Math.max(state.gain, 1e-3)), state.gain);
      g.fillStyle = `rgb(${col.map(Math.round).join(',')})`; g.fillRect(x, 0, 1, c.height);
    }
    $('lg-floor-max').textContent = '強度 ' + (1 / state.gain).toFixed(1) + ' 以上は飽和';
  }

  function stats(c) {
    const cfl = hf.speed * hf.lastDt / hf.dx;
    $('st-stable').textContent = (hf.stableDt() * 1000).toFixed(2) + ' ms';
    $('st-dt').textContent = (hf.lastDt * 1000).toFixed(2) + ' ms';
    $('st-sub').textContent = hf.lastSubsteps;
    $('st-cfl').textContent = cfl.toFixed(3);
    $('st-max').textContent = hf.maxAbs().toFixed(4) + ' m';
    $('st-energy').textContent = hf.energy().toExponential(2);
    $('st-cmean').textContent = c.mean.toFixed(3);
    $('st-cmax').textContent = c.max.toFixed(2);
  }

  let last = null;
  function frame(ts) {
    requestAnimationFrame(frame);
    const real = last === null ? 0 : Math.min(0.1, (ts - last) / 1000);
    last = ts;
    if (state.playing) {
      hf.step(state.dtFrame);
      if (state.rain) {
        state.rainClock += state.dtFrame;
        while (state.rainClock > 0.3) {
          state.rainClock -= 0.3;
          hf.disturb(Math.random() * SIZE, Math.random() * SIZE, 0.06 + Math.random() * 0.06, 0.04 + Math.random() * 0.05);
        }
      }
    }
    const c = hf.caustics(state.depth);
    drawSurface(); drawFloor(c); stats(c);
  }
  requestAnimationFrame(frame);

  // ── 操作 ──────────────────────────────────
  function pointerToWorld(e) {
    const r = surf.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * SIZE, (e.clientY - r.top) / r.height * SIZE];
  }
  let dragging = false;
  surf.addEventListener('pointerdown', e => { dragging = true; surf.setPointerCapture(e.pointerId); const [x, y] = pointerToWorld(e); hf.disturb(x, y, 0.1, 0.08); });
  surf.addEventListener('pointermove', e => { if (!dragging) return; const [x, y] = pointerToWorld(e); hf.disturb(x, y, 0.08, 0.03); });
  surf.addEventListener('pointerup', () => { dragging = false; });
  surf.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hf.disturb(SIZE / 2, SIZE / 2, 0.12, 0.1); } });

  function setPlaying(p) {
    state.playing = p;
    $('ic-play').innerHTML = `<use href="#i-${p ? 'pause' : 'play'}"/>`;
    $('lbl-play').textContent = p ? '一時停止' : '再生';
    $('btn-play').setAttribute('aria-label', p ? '一時停止' : '再生');
  }
  $('btn-play').addEventListener('click', () => setPlaying(!state.playing));
  $('btn-reset').addEventListener('click', seed);
  $('btn-rain').addEventListener('click', e => { state.rain = !state.rain; e.currentTarget.setAttribute('aria-pressed', String(state.rain)); });

  function bind(id, labelId, fmt, apply) {
    $(id).addEventListener('input', e => { const v = +e.target.value; $(labelId).textContent = fmt(v); apply(v); });
  }
  bind('sl-speed', 'lbl-speed', v => v.toFixed(2), v => { hf.speed = v; });
  bind('sl-damp', 'lbl-damp', v => v.toFixed(2), v => { hf.damping = v; });
  bind('sl-dt', 'lbl-dt', v => v.toFixed(1) + ' ms', v => { state.dtFrame = v / 1000; });
  bind('sl-depth', 'lbl-depth', v => v.toFixed(2), v => { state.depth = v; });
  bind('sl-gain', 'lbl-gain', v => v.toFixed(2), v => { state.gain = v; drawLegend(); });

  setPlaying(state.playing);
  drawLegend();
  window.fluidRipple = { hf, state, setPlaying, seed };      // 検証用
})();
</script>
</body>
</html>
