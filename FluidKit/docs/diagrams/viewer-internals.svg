<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" role="img" aria-labelledby="t d"><title id="t">ビューア内部構造</title><desc id="d">JSON 読み込みからデータセット、View、描画ループ、時間同期までの構造</desc><defs><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7589"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b9a6c"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fd6"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9aa8"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8798"/></marker></defs><rect width="1300" height="760" rx="16" fill="#f6f8fc"/><text x="30" y="38" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="22" font-weight="700" fill="#1b2333" text-anchor="start">ビューア内部 — FluidViewer / View / ui の役割</text><text x="30" y="60" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="400" fill="#5b667a" text-anchor="start">viewer/index.html の単一ファイル構成。状態は FluidViewer、DOM は ui、描画は View が持つ</text><rect x="30" y="85" width="300" height="290" rx="14" fill="#eef3ff" stroke="#2f6fed" stroke-width="1.5"/><text x="48" y="112" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#2f6fed" text-anchor="start">入力</text><text x="48" y="130" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">どちらも prepareDataset() を通る</text><rect x="50" y="135" width="260" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="50" y="135" width="6" height="56" rx="3" fill="#2f6fed"/><text x="68" y="160.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">ファイル / ドロップ</text><text x="68" y="178.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">複数可 (.json / .json.gz)</text><rect x="50" y="205" width="260" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="50" y="205" width="6" height="56" rx="3" fill="#2f6fed"/><text x="68" y="230.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">デモ generateDemo()</text><text x="68" y="248.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">重力・反発・粒子数を即時反映</text><rect x="390" y="85" width="440" height="290" rx="14" fill="#fff4e8" stroke="#d9730d" stroke-width="1.5"/><text x="408" y="112" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#d9730d" text-anchor="start">FluidViewer (状態)</text><text x="408" y="130" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">datasets[] / activeId / compare / time</text><rect x="410" y="135" width="400" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="410" y="135" width="6" height="56" rx="3" fill="#d9730d"/><text x="428" y="160.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">prepareDataset() → addDataset()</text><text x="428" y="178.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">範囲・粒子間隔・速度算出 / 同じ method は置換</text><rect x="410" y="205" width="400" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="410" y="205" width="6" height="56" rx="3" fill="#d9730d"/><text x="428" y="230.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">datasets[] ・ 手法ごとに 1 本</text><text x="428" y="248.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">DEMO は実データを読むと消える</text><rect x="410" y="275" width="400" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="410" y="275" width="6" height="56" rx="3" fill="#d9730d"/><text x="428" y="300.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">visible ・ master ・ time</text><text x="428" y="318.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">単独=active / 比較=最大 4 本 / 最長が基準</text><rect x="890" y="85" width="380" height="290" rx="14" fill="#f1ecff" stroke="#7a4fd6" stroke-width="1.5"/><text x="908" y="112" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#7a4fd6" text-anchor="start">View (データセット 1 本分)</text><text x="908" y="130" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">Scene・Points・InstancedMesh</text><rect x="910" y="135" width="340" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="910" y="135" width="6" height="56" rx="3" fill="#7a4fd6"/><text x="928" y="160.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">Points + ShaderMaterial</text><text x="928" y="178.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">位置 / 速さ属性、LUT で色、粒子間隔でサイズ</text><rect x="910" y="205" width="340" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="910" y="205" width="6" height="56" rx="3" fill="#7a4fd6"/><text x="928" y="230.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">InstancedMesh (メッシュ表示)</text><text x="928" y="248.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">最大 300 個を間引いて描画</text><rect x="910" y="275" width="340" height="56" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="910" y="275" width="6" height="56" rx="3" fill="#7a4fd6"/><text x="928" y="300.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">setFrame(idx)</text><text x="928" y="318.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">Float32Array.set でバッファを更新</text><path d="M310,163 L410,163" fill="none" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#ah-blue)"/><path d="M310,233 L355,233 L355,175 L410,175" fill="none" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#ah-blue)"/><path d="M610,191 L610,205" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><path d="M610,261 L610,275" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><path d="M810,303 L860,303 L860,163 L910,163" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><text x="860" y="225" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" fill="#d9730d" text-anchor="middle" paint-order="stroke" stroke="#f6f8fc" stroke-width="4">frameOf(ds)</text><rect x="30" y="420" width="1240" height="310" rx="14" fill="#e9f8f1" stroke="#1b9a6c" stroke-width="1.5"/><text x="48" y="447" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#1b9a6c" text-anchor="start">毎フレームの描画 (_animate)</text><text x="48" y="465" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">requestAnimationFrame</text><rect x="50" y="490" width="190" height="150" rx="10" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="50" y="490" width="190" height="6" rx="3" fill="#1b9a6c"/><circle cx="74" cy="522" r="12" fill="#1b9a6c"/><text x="74" y="526.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="94" y="527" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">時間を進める</text><text x="66" y="560" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">time += Δt × 再生速度</text><text x="66" y="580" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">ループ / 停止</text><path d="M240,565 L250,565" fill="none" stroke="#1b9a6c" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="250" y="490" width="190" height="150" rx="10" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="250" y="490" width="190" height="6" rx="3" fill="#1b9a6c"/><circle cx="274" cy="522" r="12" fill="#1b9a6c"/><text x="274" y="526.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="294" y="527" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">各データのフレーム</text><text x="266" y="560" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">frame = floor(time × fps)</text><text x="266" y="580" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">短いデータは最後で停止</text><path d="M440,565 L450,565" fill="none" stroke="#1b9a6c" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="450" y="490" width="190" height="150" rx="10" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="450" y="490" width="190" height="6" rx="3" fill="#1b9a6c"/><circle cx="474" cy="522" r="12" fill="#1b9a6c"/><text x="474" y="526.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="494" y="527" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">レイアウト</text><text x="466" y="560" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">コンテンツ領域を 1〜4 分割</text><text x="466" y="580" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">viewport + scissor</text><path d="M640,565 L650,565" fill="none" stroke="#1b9a6c" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="650" y="490" width="190" height="150" rx="10" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="650" y="490" width="190" height="6" rx="3" fill="#1b9a6c"/><circle cx="674" cy="522" r="12" fill="#1b9a6c"/><text x="674" y="526.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="694" y="527" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">uniform 更新</text><text x="666" y="560" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">uPxPerWorld・uSpacing</text><text x="666" y="580" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">色の範囲は全 View 共通</text><path d="M840,565 L850,565" fill="none" stroke="#1b9a6c" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="850" y="490" width="190" height="150" rx="10" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="850" y="490" width="190" height="6" rx="3" fill="#1b9a6c"/><circle cx="874" cy="522" r="12" fill="#1b9a6c"/><text x="874" y="526.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="894" y="527" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">render</text><text x="866" y="560" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">同じカメラで各 View を描画</text><path d="M1040,565 L1050,565" fill="none" stroke="#1b9a6c" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="1050" y="490" width="190" height="150" rx="10" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="1050" y="490" width="190" height="6" rx="3" fill="#1b9a6c"/><circle cx="1074" cy="522" r="12" fill="#1b9a6c"/><text x="1074" y="526.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1094" y="527" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">ui</text><text x="1066" y="560" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="start">凡例・ラベル・統計を更新</text><text x="50" y="690" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="600" fill="#1b2333" text-anchor="start">比較モードの同期: 全 View が同じ time から各自の fps でフレームを選ぶ (fps や長さが違うデータでもずれない)</text><text x="50" y="712" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">10 万粒子でも JS 側は 1 ms 前後 (RTX 3070 で 59 fps)。巨大な JSON は読み込みに時間がかかる点に注意</text></svg>