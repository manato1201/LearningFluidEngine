<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 520" width="1300" height="520" role="img" aria-labelledby="t d"><title id="t">SPH 1 ステップ</title><desc id="d">SPHSolver.step() の処理順</desc><defs><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7589"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b9a6c"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fd6"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9aa8"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8798"/></marker></defs><rect width="1300" height="520" rx="16" fill="#f6f8fc"/><text x="30" y="38" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="22" font-weight="700" fill="#1b2333" text-anchor="start">SPH 1 ステップ — SPHSolver.step() の処理順</text><text x="30" y="60" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="400" fill="#5b667a" text-anchor="start">solver/sph_solver.py。計算は 3D でもそのまま使える (カーネル定数は 2D 用の近似)</text><rect x="30" y="100" width="190" height="200" rx="12" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="30" y="100" width="190" height="8" rx="4" fill="#2f6fed"/><circle cx="56" cy="140" r="12" fill="#2f6fed"/><text x="56" y="144.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="78" y="145" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#1b2333" text-anchor="start">空間ハッシュ再構築</text><text x="48" y="190" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">SpatialHash.build()</text><text x="48" y="214" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">セル = 平滑化長 h</text><text x="48" y="238" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">O(N)</text><path d="M220,200 L235,200" fill="none" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#ah-blue)"/><rect x="235" y="100" width="190" height="200" rx="12" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="235" y="100" width="190" height="8" rx="4" fill="#d9730d"/><circle cx="261" cy="140" r="12" fill="#d9730d"/><text x="261" y="144.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="283" y="145" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#1b2333" text-anchor="start">密度</text><text x="253" y="190" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">_compute_density()</text><text x="253" y="214" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">ρ_i = Σ m_j W_poly6</text><text x="253" y="238" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">近傍 = ハッシュで絞る</text><path d="M425,200 L440,200" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><rect x="440" y="100" width="190" height="200" rx="12" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="440" y="100" width="190" height="8" rx="4" fill="#d9730d"/><circle cx="466" cy="140" r="12" fill="#d9730d"/><text x="466" y="144.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="488" y="145" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#1b2333" text-anchor="start">圧力</text><text x="458" y="190" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">p = max(k(ρ−ρ0), 0)</text><text x="458" y="214" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">Tait 風の状態方程式</text><text x="458" y="238" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">負圧は 0 に切る</text><path d="M630,200 L645,200" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><rect x="645" y="100" width="190" height="200" rx="12" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="645" y="100" width="190" height="8" rx="4" fill="#d9730d"/><circle cx="671" cy="140" r="12" fill="#d9730d"/><text x="671" y="144.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="693" y="145" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#1b2333" text-anchor="start">力</text><text x="663" y="190" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">_compute_forces()</text><text x="663" y="214" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">圧力 −∇p (Spiky)</text><text x="663" y="238" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">粘性 μ∇²u + 重力</text><path d="M835,200 L850,200" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><rect x="850" y="100" width="190" height="200" rx="12" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="850" y="100" width="190" height="8" rx="4" fill="#1b9a6c"/><circle cx="876" cy="140" r="12" fill="#1b9a6c"/><text x="876" y="144.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="898" y="145" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#1b2333" text-anchor="start">時間積分</text><text x="868" y="190" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">Symplectic Euler</text><text x="868" y="214" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">v += dt·a</text><text x="868" y="238" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">x += dt·v</text><path d="M1040,200 L1055,200" fill="none" stroke="#1b9a6c" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="1055" y="100" width="190" height="200" rx="12" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="1055" y="100" width="190" height="8" rx="4" fill="#7a4fd6"/><circle cx="1081" cy="140" r="12" fill="#7a4fd6"/><text x="1081" y="144.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1103" y="145" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#1b2333" text-anchor="start">境界 (呼び出し側)</text><text x="1073" y="190" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">gen_sample / compare で</text><text x="1073" y="214" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">壁に反射</text><text x="1073" y="238" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#5b667a" text-anchor="start">(Solver は持たない)</text><rect x="30" y="340" width="1240" height="150" rx="14" fill="#ffeeee" stroke="#d64545" stroke-width="1.5"/><text x="48" y="367" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#d64545" text-anchor="start">落とし穴 (実際に踏んだもの)</text><text x="50" y="395" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="400" fill="#1b2333" text-anchor="start">• _compute_forces の rho[nbrs, None] で (k,) ÷ (k,1) が (k,k) になり、近傍 2 個以上で必ずクラッシュしていた (呼び出し元がなく未検証だった)</text><text x="50" y="420" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="400" fill="#1b2333" text-anchor="start">• 修正: 係数を先に (k,) で作り、prs_coeff[:, None] * grad で (k,dim) に掛ける</text><text x="50" y="445" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="400" fill="#1b2333" text-anchor="start">• 教訓: 「最適化済み」と書かれていても呼び出し元がなければ検証されていない。まず end-to-end で 1 回動かす</text><text x="50" y="470" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="400" fill="#5b667a" text-anchor="start">• 実測は 5.6 倍 (計画は 100 倍)。粒子ごとの Python ループが残るため (docs/PERF_RESULTS.md)</text></svg>