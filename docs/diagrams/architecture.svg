<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" role="img" aria-labelledby="t d"><title id="t">FluidKit の構成</title><desc id="d">Python のソルバー(SPH・Stable Fluids・FLIP)が粒子や格子を計算し、状態ハッシュで再現性を記録する。結果は frames.json や NPZ になり、Three.js の Viewer・WebAssembly のリアルタイム SPH・Blender で見る。GNN(Neural Fluid)はソルバーの結果を学習して置き換える。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
--blue:#1a73e8;--orange:#e8710a;--teal:#0f9d8a;--red:#d92d20;--gray:#667085;--purple:#7a5af8;
--f-blue:#f3f7fe;--f-orange:#fdf6ee;--f-teal:#f0f9f7;--f-red:#fef5f4;--f-gray:#f6f7f9;--f-purple:#f6f3ff}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--grid:#1f242d;--ink:#e6e9ef;--muted:#98a2b3;--card:#1b2029;--cardline:#3a4150;--lab:#14171d;
--blue:#6ea8fe;--orange:#f5a25d;--teal:#52c7b4;--red:#f97066;--gray:#98a2b3;--purple:#a99bff;
--f-blue:#17202e;--f-orange:#271f17;--f-teal:#152422;--f-red:#2a1b1a;--f-gray:#1a1e26;--f-purple:#1f1b2e}}
text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace}
.title{font-size:16px;font-weight:600;text-anchor:middle}
.sub{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.glabel{font-size:12.5px;font-weight:700;letter-spacing:.08em}
.alabel{font-size:12px;text-anchor:middle;fill:var(--muted)}
.alabel.blue{fill:var(--blue)} .alabel.orange{fill:var(--orange)} .alabel.red{fill:var(--red)}
.note{font-size:12px;fill:var(--muted)}
.hd{font-size:20px;font-weight:700}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.2}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:var(--ink);stroke:none}
.lab{fill:var(--lab)}
.a{fill:none;stroke-width:2}
.a.primary{stroke:var(--blue)} .a.secondary{stroke:var(--gray);stroke-dasharray:6 5} .a.accent{stroke:var(--orange)} .a.danger{stroke:var(--red);stroke-dasharray:6 5}
.h.primary{fill:var(--blue)} .h.secondary{fill:var(--gray)} .h.accent{fill:var(--orange)} .h.danger{fill:var(--red)}
.badge{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}
</style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1500" height="760" fill="var(--bg)"/><rect width="1500" height="760" fill="url(#g)"/><rect x="40" y="100" width="500" height="560" rx="14" fill="var(--f-teal)" stroke="var(--teal)" stroke-width="1.5"/><rect x="62" y="90" width="151.39999999999998" height="20" fill="var(--bg)"/><text class="glabel mono" x="68" y="104.5" style="fill:var(--teal)">SOLVERS — solver/</text><rect x="600" y="100" width="400" height="560" rx="14" fill="var(--f-gray)" stroke="var(--gray)" stroke-width="1.5"/><rect x="622" y="90" width="85.8" height="20" fill="var(--bg)"/><text class="glabel mono" x="628" y="104.5" style="fill:var(--gray)">DATA — 結果</text><rect x="1060" y="100" width="410" height="560" rx="14" fill="var(--f-blue)" stroke="var(--blue)" stroke-width="1.5"/><rect x="1082" y="90" width="110.39999999999999" height="20" fill="var(--bg)"/><text class="glabel mono" x="1088" y="104.5" style="fill:var(--blue)">VIEW &amp; LEARN</text><path class="a primary" d="M432.0 220.0 L570.0 220.0 L570.0 330.0 L768.0 330.0"/><path class="h primary" d="M768.0 330.0 L757.0 324.5 L757.0 335.5 Z"/><path class="a secondary" d="M432.0 440.0 L570.0 440.0 L570.0 330.0"/><path class="h secondary" d="M570.0 330.0 L564.5 341.0 L575.5 341.0 Z"/><path class="a primary" d="M832.0 330.0 L1040.0 330.0 L1040.0 220.0 L1148.0 220.0"/><path class="h primary" d="M1148.0 220.0 L1137.0 214.5 L1137.0 225.5 Z"/><path class="a secondary" d="M1040.0 330.0 L1040.0 480.0 L1238.0 480.0"/><path class="h secondary" d="M1238.0 480.0 L1227.0 474.5 L1227.0 485.5 Z"/><path class="a secondary" d="M1212.0 220.0 L1328.0 220.0"/><path class="h secondary" d="M1328.0 220.0 L1317.0 214.5 L1317.0 225.5 Z"/><rect class="card" x="148.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(160.0 200.0) scale(1.000)"><path d="M7 17v6M12.5 11v18M18 6v28M23.5 13v14M29 9v22M34 16v8"/></g><rect class="card" x="368.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(380.0 200.0) scale(1.000)"><path d="M5 5v30h30"/><path d="M10 27l7-9 6 5 9-14"/></g><rect class="card" x="148.0" y="408.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(160.0 420.0) scale(1.000)"><circle cx="20" cy="20" r="6"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M31.3 8.7l-4.2 4.2M12.9 27.1l-4.2 4.2"/></g><rect class="card" x="368.0" y="408.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(380.0 420.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M12 20l6 6 11-12"/></g><rect class="card" x="768.0" y="298.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(780.0 310.0) scale(1.000)"><ellipse cx="20" cy="9" rx="13" ry="4.5"/><path d="M7 9v22c0 2.5 5.8 4.5 13 4.5S33 33.500 33 31V9M7 20c0 2.5 5.8 4.500 13 4.500S33 22.500 33 20"/></g><rect class="card" x="1148.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1160.0 200.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M4 15h32"/><circle class="fill" cx="9" cy="11" r="1.2"/><circle class="fill" cx="13.5" cy="11" r="1.2"/></g><rect class="card" x="1328.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1340.0 200.0) scale(1.000)"><rect x="6" y="5" width="28" height="30" rx="3"/><path d="M6 13h28M6 27h28M13 5v30M27 5v30"/></g><rect class="card" x="1238.0" y="448.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1250.0 460.0) scale(1.000)"><path d="M3 21h8l4-12 6 24 5-16 3 4h8"/></g><text class="title" x="180" y="272.0">SPH</text><text class="sub mono" x="180" y="291.0">空間ハッシュ</text><text class="sub mono" x="180" y="306.0">運動量が保存される</text><text class="title" x="400" y="272.0">Stable Fluids</text><text class="sub mono" x="400" y="291.0">格子法・numpy</text><text class="sub mono" x="400" y="306.0">完全ベクトル化</text><text class="title" x="180" y="492.0">FLIP</text><text class="sub mono" x="180" y="511.0">粒子 + 格子</text><text class="sub mono" x="180" y="526.0">のハイブリッド</text><text class="title" x="400" y="492.0">再現性</text><text class="sub mono" x="400" y="511.0">設定・状態の SHA-256</text><text class="sub mono" x="400" y="526.0">verify()</text><text class="title" x="800" y="382.0">frames.json / NPZ</text><text class="sub mono" x="800" y="401.0">gen_sample・xyz_to_json</text><text class="sub mono" x="800" y="416.0">blender_export</text><text class="title" x="1180" y="272.0">Viewer</text><text class="sub mono" x="1180" y="291.0">Three.js・WebAssembly SPH</text><text class="sub mono" x="1180" y="306.0">(リアルタイム)</text><text class="title" x="1360" y="272.0">Blender</text><text class="sub mono" x="1360" y="291.0">MCP 連携・GIF</text><text class="title" x="1270" y="532.0">Neural Fluid</text><text class="sub mono" x="1270" y="551.0">GNN v2/v3</text><text class="sub mono" x="1270" y="566.0">学習 → 推論</text><rect class="lab" x="621.2" y="309.0" width="95.7" height="16" rx="3"/><text class="alabel mono blue" x="669.0" y="321.0">結果を書き出す</text><rect class="lab" x="1056.8" y="199.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="1074.0" y="211.0">読む</text><rect class="lab" x="1063.4" y="469.0" width="71.2" height="16" rx="3"/><text class="alabel mono " x="1099.0" y="481.0">学習データ</text><text class="hd" x="40" y="44" text-anchor="start">LearningFluidEngine(FluidKit)— 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助。速さ(空間ハッシュ)・再現性(状態ハッシュ)・正しさ(物性テスト)を仕組みで守る</text></svg>
