いえ</text><rect x="780" y="450" width="200" height="76" rx="12" fill="#fff" stroke="#1b9a6c" stroke-width="2"/><text x="880.0" y="482" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#1b9a6c" text-anchor="middle">GNN (Neural Fluid)</text><text x="880.0" y="504" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="middle">要データ・訓練</text><rect x="1010" y="450" width="190" height="76" rx="12" fill="#fff" stroke="#1b9a6c" stroke-width="2"/><text x="1105.0" y="482" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#1b9a6c" text-anchor="middle">カールノイズ</text><text x="1105.0" y="504" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" font-weight="400" fill="#5b667a" text-anchor="middle">発散ゼロの飾り</text><path d="M880,378 L880,450" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><text x="906" y="420" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" fill="#d9730d" text-anchor="middle" paint-order="stroke" stroke="#f6f8fc" stroke-width="4">はい</text><path d="M1100,378 L1105,450" fill="none" stroke="#d9730d" stroke-width="1.8" marker-end="url(#ah-orange)"/><text x="1130" y="420" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11.5" fill="#d9730d" text-anchor="middle" paint-order="stroke" stroke="#f6f8fc" stroke-width="4">いいえ(見た目だけ)</text><text x="30" y="680" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="400" fill="#5b667a" text-anchor="start">迷ったら: 比較モードで同じ条件を複数手法に与えて見比べる (tools/compare_solvers.py → ビューアに複数 JSON をドロップ)</text></svg>