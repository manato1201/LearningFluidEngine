thic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">壁の反射 (restitution 0.3)</text><text x="938" y="185.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">SPHSolver は境界を持たないので gen_sample 側</text><circle cx="1278" cy="142" r="12" fill="#2f6fed"/><text x="1278" y="146.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="920" y="310" width="380" height="100" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="920" y="310" width="6" height="100" rx="3" fill="#1b9a6c"/><text x="938" y="357.0" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">viewer/data/water_drop.json(.gz)</text><text x="938" y="375.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">metadata(method…) / frames / speeds</text><circle cx="1278" cy="332" r="12" fill="#1b9a6c"/><text x="1278" y="336.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="480" y="310" width="380" height="100" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="480" y="310" width="6" height="100" rx="3" fill="#7a4fd6"/><text x="498" y="357.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">loadFiles() — ドロップ / 開く</text><text x="498" y="375.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">.json / .json.gz (DecompressionStream)</text><circle cx="838" cy="332" r="12" fill="#7a4fd6"/><text x="838" y="336.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="40" y="310" width="380" height="100" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="40" y="310" width="6" height="100" rx="3" fill="#7a4fd6"/><text x="58" y="357.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">prepareDataset()</text><text x="58" y="375.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">速度の算出・y と速さの最小最大・粒子間隔</text><circle cx="398" cy="332" r="12" fill="#7a4fd6"/><text x="398" y="336.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="40" y="500" width="380" height="100" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="40" y="500" width="6" height="100" rx="3" fill="#7a4fd6"/><text x="58" y="547.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13.5" font-weight="600" fill="#1b2333" text-anchor="start">View (Scene + Points)</text><text x="58" y="565.0" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#5b667a" text-anchor="start">色は LUT テクスチャ、サイズは粒子間隔基準</text><circle cx="398" cy="522" r="12" fill="#7a4fd6"/><text x="398" y="526.5" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><rect x="480" y="500" width="380" height="100" rx="9" fill="#fff" stroke="#d3d9e6" stroke-width="1.2"/><rect x="480" y="500" width="6" height="100" rx="3" fill="#7a4fd6"/><text x="498" 