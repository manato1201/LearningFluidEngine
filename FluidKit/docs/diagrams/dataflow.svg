<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 700" width="1340" height="700" role="img" aria-labelledby="t d"><title id="t">データの流れ</title><desc id="d">gen_sample.py が JSON を作り、ビューアが読み込んで描画するまで</desc><defs><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7589"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b9a6c"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fd6"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9aa8"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8798"/></marker></defs><rect width="1340" height="700" rx="16" fill="#f6f8fc"/><text x="30" y="38" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="22" font-weight="700" fill="#1b2333" text-anchor="start">データの流れ — gen_sample.py からビューアの描画まで</text><text x="30" y="60" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif" font-size="